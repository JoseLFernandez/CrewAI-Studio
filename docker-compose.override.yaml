version: '4.0'

services:
  web:
    volumes:
      - ./:/CrewAI-Studio
    command: streamlit run ./app/app.py --server.headless true --server.port 8501 --server.fileWatcherType auto

  api:
    volumes:
      - ./:/CrewAI-Studio
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
